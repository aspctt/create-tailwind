# Everything specific to one target lives here. Adding a target means adding a sibling
# directory, not editing the shared build scripts.
mod_loader=neoforge

# Latest versions: https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.250
neo_version_range=[21.1.250,)
loader_version_range=[1,)

# Parchment parameter names and javadoc.
# Latest versions: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Create and the libraries it is built on. Create, Ponder and Flywheel come from maven.createmod.net,
# Registrate from maven.ithundxr.dev. The Create build is the last one published for 6.0.10, the newest
# public release; later builds on that maven are 6.0.11 development builds.
create_version=6.0.10-281
create_version_range=[6.0.10,6.1.0)
ponder_version=1.0.87
flywheel_version=1.0.6-44
registrate_version=MC1.21-1.3.0+67

# JEI, compiled against its API and loaded in the development run only.
jei_version=19.54.0.427
