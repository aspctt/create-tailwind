# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Mod Properties
# Per-target properties live in versions/<target>/gradle.properties

# "Create: Airbound" is a working title. Renaming touches mod_id, mod_archives_name, mod_name and
# mod_group_id here, rootProject.name in settings.gradle.kts, the Java package, and the MOD_ID constant.

# Must fit the regex [a-z][a-z0-9_]{1,63} and match CreateAirbound.MOD_ID.
mod_id=createairbound
# Base name of the built jar, which is published as
# <archives_name>-<mod_version>+<minecraft_version>-<mod_loader>.jar
mod_archives_name=CreateAirbound
mod_name=Create: Airbound
# Placeholder until the licence is decided. See LICENSE.
mod_license=All Rights Reserved
mod_version=1.0.0
# Should match the base package used for the mod sources.
mod_group_id=com.aspctt.createairbound
mod_authors=aspctt
mod_description=Compact jetpacks and boosters powered by compressed air. Worn alone they fly like a jetpack, and worn with an elytra they boost your glide instead.
