# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Mod Properties
# Per-target properties live in versions/<target>/gradle.properties

# Must fit the regex [a-z][a-z0-9_]{1,63} and match CreateTailwind.MOD_ID.
mod_id=createtailwind
# Base name of the built jar, which is published as
# <archives_name>-<mod_version>+<minecraft_version>-<mod_loader>.jar
mod_archives_name=CreateTailwind
mod_name=Create: Tailwind
# The code is GPL-3.0-only and the assets are All Rights Reserved. See LICENSE and NOTICE.
mod_license=GPL-3.0-only (code), All Rights Reserved (assets)
mod_version=1.0.0
# Should match the base package used for the mod sources.
mod_group_id=com.aspctt.createtailwind
mod_authors=aspctt
mod_description=Compact jetpacks and boosters powered by compressed air. Worn alone they fly like a jetpack, and worn with an elytra they boost your glide instead.
