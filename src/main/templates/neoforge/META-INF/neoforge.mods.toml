modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/aspctt/create-tailwind/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''${mod_description}'''
logoFile = "icon.png"
authors = "${mod_authors}"
displayURL = "https://modrinth.com/mod/create-tailwind"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# The jetpacks and boosters run on Create's compressed air, and charge the way its backtanks do.
[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "NONE"
side = "BOTH"

# The config screen is the only thing that uses YACL and every route into it is
# guarded, so the mod runs without it. Without YACL the config button opens a
# prompt offering to install it instead.
[[dependencies.${mod_id}]]
modId = "yet_another_config_lib_v3"
type = "optional"
versionRange = "[${yacl_min_version},)"
ordering = "AFTER"
side = "CLIENT"
